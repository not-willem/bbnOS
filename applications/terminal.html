
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poop</title>
    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: "Google Sans Flex", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            background-color: black;
            border: 2px solid black;
            box-shadow: 0 10px 30px rgba(0,0,0,0);
            overflow: hidden;
        }

        .terminal-body {
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.4;
        }

        .history-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }


        .cmd-input {
            background: transparent;
            border: none;
            color: white;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex-grow: 1;
            padding: 0;
        }
        .closebutton {
            font-family: "Google Sans Flex", sans-serif;
            font-weight: 100;
            text-align: center;
            color:white;
            position: absolute;
            text-decoration: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-body" id="terminalBody" onclick="focusInput()">

        <div id="history">
            <div class="history-line">Microsoft Windows [Version 10.0.19045.6466]</div>
            <div class="history-line">(c) Microsoft Corporation. All rights reserved.</div>
        </div>

        <div class="input-line">
            <span class="prompt">C:\> </span>
            <input type="text" id="cmdInput" class="cmd-input" autofocus autocomplete="off" stroke="none">
        </div>
</div>
    


<script>
    const cmdInput = document.getElementById('cmdInput');
    const history = document.getElementById('history');
    const terminalBody = document.getElementById('terminalBody');

    
    function focusInput() {
        cmdInput.focus();
    }
    cmdInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const commandText = cmdInput.value.trim();
            
            if (commandText !== "") {
                processCommand(commandText);
            }
            
            cmdInput.value = "";
        }
    });
    function processCommand(cmd) {
        const userLine = document.createElement('div');
        userLine.className = 'history-line';
        userLine.innerHTML = `<span class="prompt">C:\> </span> ${escapeHTML(cmd)}`;
        history.appendChild(userLine);

        const outputLine = document.createElement('div');
        outputLine.className = 'history-line';

        const lowerCmd = cmd.toLowerCase();

        if (lowerCmd === 'help') {
            outputLine.innerText = "  help        Show this message\n  about     Learn about bbnOS\n  cls           Clears the screen.\n  date        Display current date and time \n  echo        Echo message\n  curl          Make a request to the internet\n  exit          close this window";
        } 
        else if (lowerCmd === 'about') {
            outputLine.innerText = "bbnOS is the most os that could ever os and it is the best os\n we love it and so do you";
        } 
        else if (lowerCmd === 'date') {
            outputLine.innerText = new Date().toString();
        } 
        else if (lowerCmd === 'cls') {
            history.innerHTML = '';
            return; 
        } 
        else if (lowerCmd === 'peenar') {
            outputLine.innerText = "one time i was jorking my peenar but then i realized i lost my hands in a car crash and it was actually evil larry who was jorking my peenar";
        }
        else if (lowerCmd === 'mrbeest') {
            outputLine.innerText = "brmeest";
        } 
        else if (lowerCmd.split(" ")[0] === 'echo') {
            const firstSpace = lowerCmd.indexOf(' ');
            outputLine.innerText = firstSpace !== -1 ? lowerCmd.slice(firstSpace + 1) : "";
        }
        else if (lowerCmd === "exit") {
            outputLine.innerText = "closing..";
            window.parent.postMessage({ action: "closwindow" }, "*");
        }
        else if (cmd.split(" ")[0].toLowerCase() === 'curl') {
            const firstSpace = cmd.indexOf(' ');
            let url = firstSpace !== -1 ? cmd.slice(firstSpace + 1).trim() : "";
            
            if (url && !/^https?:\/\//.test(url)) {
                url = 'https://' + url;
            }

            if (!url) {
                outputLine.innerText = "Usage: curl <url>";
            } else {
                outputLine.innerText = "curling please wait...";
                (async () => {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const html = await response.text();
                        outputLine.innerText = html;
                    } catch (error) {
                        outputLine.innerText = `oh no: ${error.message}\nalso a lot of websites block direct fetch requests due to CORS rules stinky.`;
                    }
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                })();
            }
        }
        else {
            outputLine.innerText = `'${cmd}' is not recognized as an internal or external command, operable program or batch file.`;
        }
        history.appendChild(outputLine);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }
    function escapeHTML(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
