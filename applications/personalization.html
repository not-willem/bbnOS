<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        background-color: #ff6c6c;
        font-family: "Google Sans Flex";
        font-size: 20px;
        padding: 20px;
    }
    
    .asidj {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255,255,255,0.9);
        border-radius: 10px;
    }
    
    .asdfdf {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        background: rgba(255,255,255,0.9);
        border-radius: 10px;
        gap: 15px;
    }
    
    input[type="file"] {
        font-family: "Google Sans Flex";
        font-size: 20px;
        color: #000000;
        margin-left: 10px;
    }
    
    .custom-file-button {
        background-color: #000000;
        color: white;
        font-family: "Google Sans Flex";
        font-size: 18px;
        padding: 10px 20px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }
    
    .custom-file-button:hover {
        background-color: #333333;
    }
    
    #fileName {
        font-family: "Google Sans Flex";
        font-size: 16px;
        color: #0066cc;
        margin-top: 10px;
    }
    
    #asdjd {
        font-family: "Google Sans Flex";
        font-size: 18px;
        color: #006600;
        margin-top: 15px;
        text-align: center;
    }
    
    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 95vh;
        gap: 30px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="asidj">
        <label for="bgInput">Select background image:</label>
        <input type="file" id="bgInput" accept="image/*" />
    </div>
    
    <div class="asdfdf">
        <label for="appman">Install new application:</label>
        <input type="file" id="appman" accept=".html" style="display: none;" />
        <button onclick="document.getElementById('appman').click()" class="custom-file-button">Choose HTML File</button>
        <span id="fileName"></span>
        <p id="asdjd"></p>
    </div>
</div>

<script>
    const bgInput = document.getElementById('bgInput');
    
    bgInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        
        if (file) {
            const imageURL = URL.createObjectURL(file);
            window.parent.postMessage({
                type: 'SET_BACKGROUND',
                url: imageURL
            }, window.location.origin);
        }
    });
    
    const appman = document.getElementById('appman');
    const djf = document.getElementById('asdjd');
    const fileNameSpan = document.getElementById('fileName');
    const customButton = document.querySelector('.custom-file-button');
    
    appman.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        
        if (file) {
            fileNameSpan.textContent = 'Selected: ' + file.name;
            const fileContent = await file.text();
            window.parent.postMessage({
                type: 'INSTALL',
                content: fileContent,
                filename: file.name
            }, window.location.origin);
            appman.remove();
            customButton.remove();
            fileNameSpan.remove();
            djf.innerText = "Installed! You can now close this window and check it out";
        }
    });
</script>
</body>
